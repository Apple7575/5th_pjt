{% extends "base.html" %}

{% block content %}
  <h2 class="my-4">메인 페이지</h2>
  
  <div class="row row-cols-1 row-cols-md-3 g-4">
    
    {% for book in books %}
      <div class="col">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title fw-bold">{{ book.title }}</h5>
            
            <p class="card-text">{{ book.description|truncatechars:150 }}</p>
            
            <a href="{% url 'books:detail' book.pk %}" class="btn btn-primary">Detail</a>
          </div>
        </div>
      </div>
      
    {% empty %}
      <div class="col-12">
        <p class="text-muted">현재 등록된 도서가 없습니다.</p>
      </div>
    {% endfor %}
    
  </div>
{% endblock content %}
