<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyPJT - ThRead</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-success mb-4" data-bs-theme="dark">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="{% url 'books:index' %}">ThRead</a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'books:index' %}">INDEX</a> 
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'books:create' %}">CREATE</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">회원정보 수정</a> 
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">회원탈퇴</a> 
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">LOGOUT</a> 
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    {% block content %}
    {% endblock content %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
