{% extends 'base.html' %}

{% block content %}
  <h1>회원정보 수정</h1>

  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">수정</button>
  </form>

  <hr>

  <a href="{% url 'accounts:change_password' %}">
    비밀번호 변경
  </a>

  <hr>

  <form action="{% url 'accounts:delete' %}" method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">
      회원탈퇴
    </button>
  </form>
{% endblock content %}
